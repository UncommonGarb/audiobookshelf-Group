<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiobookshelf - Join Group Listening Room</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #232323;
      color: #ffffff;
      font-family: 'Source Sans Pro', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .join-card {
      background-color: #2a2a2a;
      border: 1px solid #444444;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      text-align: center;
    }

    .join-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1ad691;
      margin-bottom: 0.5rem;
    }

    .join-logo img {
      width: 42px;
      height: 42px;
    }

    .join-subtitle {
      color: #bbbbbb;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .room-badge-pill {
      background-color: #111111;
      border: 1px dashed #1ad691;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .room-code-text {
      font-family: 'Ubuntu Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1ad691;
      letter-spacing: 2px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #bbbbbb;
    }

    .form-input {
      background-color: #333333;
      border: 1px solid #444444;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .form-input:focus {
      border-color: #1ad691;
    }

    .btn-join-large {
      width: 100%;
      padding: 0.85rem;
      background-color: #1ad691;
      color: #111111;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-join-large:hover {
      background-color: #15b378;
    }
  </style>
</head>
<body>

  <div class="join-card">
    <div class="join-logo">
      <img src="https://raw.githubusercontent.com/advplyr/audiobookshelf/master/client/static/icon.svg" alt="Audiobookshelf Logo">
      <span>audiobookshelf</span>
    </div>
    <div class="join-subtitle">Public Group Audiobook Session</div>

    <div class="room-badge-pill">
      <div style="text-align:left;">
        <div style="font-size:0.7rem; color:#bbbbbb; font-weight:700;">ROOM CODE</div>
        <div class="room-code-text">READ-4829</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:0.75rem; font-weight:700; color:#fff;">Project Hail Mary</div>
        <div style="font-size:0.65rem; color:#1ad691;">Host: Alex</div>
      </div>
    </div>

    <form onsubmit="joinRoom(event)">
      <div class="form-group">
        <label for="displayName">Your Display Name</label>
        <input type="text" id="displayName" class="form-input" placeholder="e.g. Taylor" value="Taylor" required>
      </div>

      <div class="form-group">
        <label for="roomCode">Room Code or ID</label>
        <input type="text" id="roomCode" class="form-input" value="READ-4829" required style="font-family:'Ubuntu Mono'; text-transform:uppercase;">
      </div>

      <div class="form-group">
        <label for="roomPass">Room Password (Optional)</label>
        <input type="password" id="roomPass" class="form-input" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-join-large">
        <span class="material-symbols-outlined">headset</span>
        Join Listening Room
      </button>
    </form>
  </div>

  <script>
    function joinRoom(e) {
      e.preventDefault();
      window.location.href = 'now-playing.html?guest=true&name=' + encodeURIComponent(document.getElementById('displayName').value);
    }
  </script>
</body>
</html>
